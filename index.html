ome keys.(Look at the screen, not the keys.(Type slowly and correctly.(Let's go home.(It's a nice day.(I don't like rain.(Don't be late!(Wow, that is great!(Is it your turn?(Are you ready?(Happy birthday!(We did it!`.split(`(`),Qe=[{id:`b1`,title:`My School Day`,zhTitle:`我的上學日`,body:`I get up at six thirty every morning. I eat breakfast with my family and then I walk to school. My first class is English. I like it because our teacher tells funny stories. At noon we eat lunch in the classroom. After school I play basketball with my friends.`,zh:`我每天早上六點半起床。我和家人一起吃早餐，然後走路去上學。我的第一堂課是英文。我喜歡英文課，因為我們老師會講好笑的故事。中午我們在教室吃午餐。放學後，我和朋友一起打籃球。`},{id:`b2`,title:`My Dog Lucky`,zhTitle:`我的狗狗幸運`,body:`I have a small dog. His name is Lucky. He has big brown eyes and a short tail. Lucky likes to run in the park. When I come home, he jumps and waves his tail. I give him food and water every day. He is my best friend.`,zh:`我有一隻小狗，牠的名字叫幸運。牠有一雙棕色的大眼睛和一條短尾巴。幸運喜歡在公園裡跑。我回家的時候，牠會跳起來搖尾巴。我每天給牠食物和水。牠是我最好的朋友。`},{id:`b3`,title:`A Rainy Sunday`,zhTitle:`下雨的星期天`,body:`It was a rainy Sunday. We could not go to the beach. My sister and I stayed home. We made cookies with Mom. The kitchen smelled sweet. Then we watched a movie and drank hot milk. It was not a bad day at all.`,zh:`那是一個下雨的星期天，我們不能去海邊。我和姊姊待在家裡，跟媽媽一起做餅乾，廚房聞起來甜甜的。接著我們看了一部電影，喝了熱牛奶。這一天其實一點也不糟。`},{id:`b4`,title:`The Night Market`,zhTitle:`夜市`,body:`Many people in Taiwan love night markets. You can find many kinds of food there. My favorite is fried chicken. My dad likes stinky tofu, but I do not. There are also games and cheap clothes. We go to the night market once a month.`,zh:`在臺灣，很多人都喜歡逛夜市。在那裡可以找到很多種食物。我最喜歡炸雞。我爸爸喜歡臭豆腐，但我不喜歡。夜市裡也有遊戲和便宜的衣服。我們一個月去一次夜市。`},{id:`b5`,title:`Learning to Type`,zhTitle:`學打字`,body:`Typing is a useful skill. First, put your fingers on the home keys. Look at the screen, not at the keyboard. Type slowly and try not to make mistakes. Practice for ten minutes every day. Soon your fingers will remember where the keys are.`,zh:`打字是一項有用的技能。首先，把手指放在基準鍵上。眼睛看螢幕，不要看鍵盤。慢慢打，盡量不要打錯。每天練習十分鐘，很快你的手指就會記住每個鍵在哪裡。`},{id:`b6`,title:`My Best Friend`,zhTitle:`我最好的朋友`,body:`My best friend is Amy. She is twelve years old, just like me. She is tall and has long hair. Amy is good at drawing, and I am good at math. We help each other with our homework. On weekends we often ride bikes together.`,zh:`我最好的朋友是艾咪。她跟我一樣十二歲。她個子高，留著長頭髮。艾咪很會畫畫，而我很會數學。我們會互相幫忙寫功課。週末我們常常一起騎腳踏車。`},{id:`b7`,title:`Four Seasons`,zhTitle:`四季`,body:`There are four seasons in a year. Spring is warm and the flowers are beautiful. Summer is hot, so we like to swim. In fall the weather is cool and the leaves turn yellow. Winter is cold, but we can eat hot soup and stay warm.`,zh:`一年有四個季節。春天很溫暖，花很漂亮。夏天很熱，所以我們喜歡游泳。秋天天氣涼爽，樹葉會變黃。冬天很冷，不過我們可以喝熱湯保暖。`},{id:`b8`,title:`A Trip to the Zoo`,zhTitle:`動物園之旅`,body:`Last Saturday my class went to the zoo. We saw lions, tigers, and a big elephant. The monkeys were very funny. They jumped from tree to tree. Our teacher asked us to draw our favorite animal. I drew a panda eating bamboo.`,zh:`上星期六，我們班去了動物園。我們看到獅子、老虎和一頭大象。猴子很好笑，牠們在樹之間跳來跳去。老師要我們畫出最喜歡的動物，我畫了一隻正在吃竹子的貓熊。`},{id:`b9`,title:`About Me`,zhTitle:`關於我`,body:`Hi! My name is Ben. I am twelve years old, and I am a student at a junior high school in Taipei. I have short black hair and brown eyes. I like music and sports. My favorite food is beef noodles. I want to be a doctor in the future because I want to help sick people.`,zh:`嗨！我的名字是阿班。我十二歲，是臺北一所國中的學生。我留著黑色短髮，有一雙棕色的眼睛。我喜歡音樂和運動，最喜歡的食物是牛肉麵。我將來想當醫生，因為我想幫助生病的人。`},{id:`b10`,title:`My Family`,zhTitle:`我的家人`,body:`There are five people in my family. My father is a bus driver, and my mother works in a bank. I have an older sister and a little brother. My sister likes to read books, and my brother likes to play with his toy cars. On Sunday evenings, we eat dinner together and talk about our week.`,zh:`我家有五個人。爸爸是公車司機，媽媽在銀行上班。我有一個姊姊和一個弟弟。姊姊喜歡看書，弟弟喜歡玩他的玩具車。每個星期天晚上，我們會一起吃晚餐，聊聊這一週發生的事。`},{id:`b11`,title:`The School Club`,zhTitle:`社團活動`,body:`Every Friday afternoon, students at our school join different clubs. I am in the science club. We do fun experiments and learn how things work. My friend Lisa is in the music club. She plays the guitar very well. Joining a club is a great way to make new friends and learn new skills.`,zh:`每個星期五下午，我們學校的學生會參加不同的社團。我參加科學社，我們會做有趣的實驗，了解東西是怎麼運作的。我的朋友麗莎參加音樂社，她吉他彈得很好。參加社團是交新朋友、學新技能的好方法。`},{id:`b12`,title:`A Birthday Party`,zhTitle:`生日派對`,body:`Today is my best friend Kevin's birthday. We are having a party at his house. His mother made a big chocolate cake. We sing the birthday song, and Kevin makes a wish. Then he opens his gifts. I give him a book about animals. He says, Thank you! I love it! Everyone has a wonderful time.`,zh:`今天是我最好的朋友凱文的生日，我們在他家開派對。他媽媽做了一個大大的巧克力蛋糕。我們唱生日快樂歌，凱文許了一個願望，接著他打開禮物。我送他一本關於動物的書。他說：「謝謝你！我好喜歡！」大家都玩得很開心。`},{id:`b13`,title:`The Weather in Taiwan`,zhTitle:`臺灣的天氣`,body:`The weather in Taiwan is usually warm. Summer is very hot, and it often rains in the afternoon. Sometimes a typhoon comes and brings strong wind and heavy rain. Winter is not very cold, but it is wet in the north. Before you go out, check the weather and take an umbrella.`,zh:`臺灣的天氣通常很溫暖。夏天非常熱，下午常常會下雨。有時候颱風來了，會帶來強風和大雨。冬天不太冷，但北部很潮濕。出門前，記得看一下天氣，帶把雨傘。`},{id:`b14`,title:`Shopping for a Jacket`,zhTitle:`買外套`,body:`Amy goes to the store with her mother. She wants to buy a new jacket for winter. She finds a blue jacket, but it is too big. The clerk gives her a smaller one. It fits well. The price is eight hundred dollars. Her mother pays for it, and Amy says thank you.`,zh:`艾咪和媽媽一起去商店。她想買一件冬天穿的新外套。她找到一件藍色外套，可是太大了。店員拿了一件小一點的給她，這件剛剛好。價錢是八百元。媽媽幫她付了錢，艾咪向媽媽說謝謝。`},{id:`b15`,title:`Asking the Way`,zhTitle:`問路`,body:`A girl asks a police officer, Excuse me, where is the library? The officer smiles and says, Walk down this street and turn left at the second corner. The library is next to the post office. The girl says thank you and walks there. Now she can borrow some books.`,zh:`一個女孩問警察：「不好意思，請問圖書館在哪裡？」警察笑著說：「沿著這條街走，在第二個轉角左轉，圖書館就在郵局旁邊。」女孩道謝後走了過去。現在她可以借一些書了。`},{id:`b16`,title:`Sports Day`,zhTitle:`運動會`,body:`Our school has a sports day every November. Students run races, jump, and play games on the field. Our class is in the relay race, and I am the last runner. I run as fast as I can, and we win second place! We are tired but very happy.`,zh:`我們學校每年十一月都會舉辦運動會。學生們在操場上賽跑、跳遠、玩遊戲。我們班參加大隊接力，我是最後一棒。我拚命地跑，我們得到第二名！大家雖然很累，但是非常開心。`},{id:`b17`,title:`The Dragon Boat Festival`,zhTitle:`端午節`,body:`The Dragon Boat Festival comes in early summer. People in Taiwan eat rice dumplings and watch dragon boat races on the river. The teams row together and try to win. My grandmother makes rice dumplings with meat and eggs. They are delicious! It is one of my favorite holidays.`,zh:`端午節在初夏。臺灣人會吃粽子，也會到河邊看龍舟比賽。每一隊齊心划船，努力想贏。我奶奶包的粽子裡有肉和蛋，非常好吃！端午節是我最喜歡的節日之一。`},{id:`b18`,title:`Chinese New Year`,zhTitle:`農曆新年`,body:`Chinese New Year is the most important holiday in Taiwan. Before the new year, families clean their houses. On New Year's Eve, we have a big dinner with our grandparents. Children get red envelopes with money in them. We stay up late and say Happy New Year to everyone.`,zh:`農曆新年是臺灣最重要的節日。過年前，家家戶戶都會大掃除。除夕夜，我們和祖父母一起吃年夜飯。小孩子會拿到裝著錢的紅包。我們會熬夜守歲，並向每個人說新年快樂。`},{id:`b19`,title:`Healthy Habits`,zhTitle:`健康好習慣`,body:`To stay healthy, eat more fruit and vegetables, and drink enough water. Do not eat too much candy or fried food. Exercise for thirty minutes every day; you can jog, swim, or ride a bike. Go to bed early and sleep for eight hours. Healthy habits help you learn better at school.`,zh:`想要保持健康，就要多吃水果和蔬菜，並且喝足夠的水。不要吃太多糖果或油炸食物。每天運動三十分鐘，可以慢跑、游泳或騎腳踏車。早點上床，睡滿八個小時。健康的習慣能幫助你在學校學得更好。`},{id:`b20`,title:`Recycling at Home`,zhTitle:`在家做回收`,body:`Our family recycles every day. We put paper, bottles, and cans in different boxes. We do not throw them in the trash. On Tuesday and Friday evenings, the garbage truck comes, and we take our boxes outside. Recycling is easy, and it helps keep our earth clean and beautiful.`,zh:`我們家每天都做資源回收。我們把紙類、瓶子和罐子分別放進不同的箱子裡，不會把它們丟進垃圾桶。每個星期二和星期五晚上垃圾車來的時候，我們就把箱子拿到外面。回收很簡單，而且能讓我們的地球保持乾淨美麗。`}];function $e(e){let t=e>>>0;return()=>{t=t+1831565813>>>0;let e=t;return e=Math.imul(e^e>>>15,e|1),e^=e+Math.imul(e^e>>>7,e|61),((e^e>>>14)>>>0)/4294967296}}function et(){return Math.floor(Math.random()*2**31)}function N(e,t){return t[Math.floor(e()*t.length)]}function tt(e,t,n){let r=0;for(let e of t)r+=Math.max(0,n(e));if(r<=0)return N(e,t);let i=e()*r;for(let e of t)if(i-=Math.max(0,n(e)),i<=0)return e;return t[t.length-1]}function nt(e,t){for(let n of e)if(!t.has(n))return!1;return!0}function rt(e){return Xe.filter(t=>nt(t,e))}function it(e,t){let n=e;return t.has(`A`)||(n=n.toLowerCase()),n=n.replace(/[.,?!]/g,e=>t.has(e)?e:``),n=n.replace(/\s+/g,` `).trim(),nt(n,t)?n:null}function at(e){let t=new Set;for(let n of Ze){let r=it(n,e);r&&r.split(` `).length>=2&&t.add(r)}return[...t]}function ot(e,t,n){let r=[],i=0,a=0,o=0;for(;i<t&&o++<1e3;){let t=n(e,a++);t&&(r.length&&r[r.length-1]===t&&o<900||(r.push(t),i+=t.length+1))}return r.join(` `)}function st(e,t,n,r){let i=n+Math.floor(e()*(r-n+1)),a=``;for(let n=0;n<i;n++)a+=N(e,t);return a}var ct=e=>/^[a-z]$/.test(e),lt=e=>/^[A-Z]$/.test(e),ut=e=>/^[0-9]$/.test(e);function dt(e){let t=rt(E(e)).length,n=[`intro`,`single`,`combo`];return t>=6?n.push(`words`):n.push(`combo`),t>=15&&n.push(`sentences`),n}function ft(e){let t=re(e).minWpm;return Math.max(25,Math.min(120,Math.round(t*5*.75)))}var pt=[`I have {n} books.`,`There are {n} students in my class.`,`He is {n} years old.`,`We need {n} eggs.`,`The bus comes at {n}.`,`My room number is {n}.`,`She has {n} pens.`,`It costs {n} dollars.`,`Open your book to page {n}.`,`We walked {n} steps today.`];function mt(e,t,n){let r=1+Math.floor(e()*3),i=``;for(let a=0;a<r;a++)i+=e()<.5?N(e,n):N(e,t);if(i.length>1&&i[0]===`0`){let n=t.filter(e=>e!==`0`);i=n.length?N(e,n)+i.slice(1):`0`}return i}function ht(e){return e.charAt(0).toUpperCase
